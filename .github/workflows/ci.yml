name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "gunicorn>=21,<23" "uvicorn[standard]>=0.30,<1.0"

      - name: Run tests
        env:
          # Keep the suite offline: no real embedding/LLM credentials in CI.
          EMBEDDING_BASE_URL: ""
          EMBEDDING_API_KEY: ""
          EMBEDDING_MODEL: ""
          LLM_BASE_URL: ""
          LLM_API_KEY: ""
          LLM_MODEL: ""
        run: pytest -q
