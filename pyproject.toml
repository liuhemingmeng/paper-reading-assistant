[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reading-assistant"
version = "0.1.0"
description = "A learning-oriented foundation for a paper and research report reading assistant."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pymupdf>=1.24.12,<2.0",
    "python-multipart>=0.0.18,<1.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<1.0",
    "psycopg>=3.1,<4",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
